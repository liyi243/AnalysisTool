name: Build Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials pyinstaller

      - name: Self-test
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python src/main.py --selftest

      - name: Build portable (green) package
        run: python -m PyInstaller --noconfirm --clean 3762tool.spec

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\376.2协议解析工具\*" -DestinationPath "376.2-Protocol-Tool-v1.1.1-win64-portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            376.2-Protocol-Tool-v1.1.1-win64-portable.zip
            installer_out/376.2-Protocol-Tool-v1.1.1-win64-setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            376.2-Protocol-Tool-v1.1.1-win64-portable.zip
            installer_out/376.2-Protocol-Tool-v1.1.1-win64-setup.exe
